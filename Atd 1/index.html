<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de Compras</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Krona+One&family=Montserrat&family=Numans&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="estilo.css" />
  </head>

  <body>
    <main>
      <img src="https://i.pinimg.com/originals/fc/9d/ff/fc9dfff31121e22216be786dc7a2ee5f.jpg" />
      <form>
        <input
          class="input-item"
          id="input-item"
          type="text"
          placeholder="Digite o item que deseja adicionar"
        />
        <button class="button-item" id="adicionar-item" type="submit">Salvar item</button>
      </form>

      <div class="container-lista">
        <h2>Lista de compras</h2>
        <hr />

        <ul id="lista-de-compras">
          <li>
            <div class="lista-item-container">
              <input type="checkbox" id="checkbox-1" />
              <p>Ração de gato</p>
              <button
                class="item-lista-button"
                type="button"
                aria-label="Remover Ração de gato"
              >
                🗑
              </button>
            </div>
            <p class="texto-data">Segunda-feira (31/10/2022) às 08:30</p>
          </li>
          <li class="mensagem-lista-vazia" hidden>
            <p>A lista não possui nenhum item no momento.</p>
          </li>
        </ul>
      </div>
    </main>
    <script defer src="script.js"></script>
  </body>
</html>
